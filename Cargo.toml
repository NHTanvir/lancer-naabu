[package]
name = "lancer-naabu"
version = "0.1.0"
edition = "2021"
description = "Rust clone of naabu — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-naabu"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ipnet = "2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
futures = "0.3"
governor = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
